services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tickets
      MYSQL_USER: tickets
      MYSQL_PASSWORD: local-tickets
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - ticket-data:/var/lib/mysql
      - ./migrations/001_create_tickets.sql:/docker-entrypoint-initdb.d/001_create_tickets.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=tcp -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT id FROM tickets LIMIT 0'"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  ticket-data:
